# えるのマダミス作品一覧（古い順）
# 作品を追加するときは、この末尾に1ブロック足すだけ。
# 空欄の項目は表示されません。
#
#   slug:     URL用の名前（/games/<slug>/ に詳細ページがあれば page: true）
#   title:    作品名
#   color:    作品のテーマ色（ホバーやリンクの差し色）
#   font:     タイトルの書体（CSS の font-family。layout で Google Fonts を読み込んでいるもの）
#   tagline:  一言紹介（About に表示）
#   players:  人数（数字）
#   playtime: プレイ時間（表記そのまま）
#   gm:       GM（"不要" / "必須" など）
#   image:    一覧用画像（/assets/images/ 以下。cards/<slug>.jpg に 600x800 程度で置く）
#   image_position: 画像の切り抜き位置（例: top, center 30%）。省略時は中央
#   links:    販売・公開先 [{label, url}]。url を省くと店舗名だけ表示（リンクなし）
#   status:   active（販売・公開中） / ended（終了）

